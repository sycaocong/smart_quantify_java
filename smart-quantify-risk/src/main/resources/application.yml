server:
  port: 8082

spring:
  application:
    name: smart-quantify-risk
  datasource:
    url: ${SPRING_DATASOURCE_MASTER_URL:jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_MASTER_USERNAME:root}
    password: ${SPRING_DATASOURCE_MASTER_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: master-hikari-pool
      validation-timeout: 5000
    master:
      url: ${SPRING_DATASOURCE_MASTER_URL:jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_MASTER_USERNAME:root}
      password: ${SPRING_DATASOURCE_MASTER_PASSWORD:password}
      driver-class-name: com.mysql.cj.jdbc.Driver
    slave:
      url: ${SPRING_DATASOURCE_SLAVE_URL:jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_SLAVE_USERNAME:root}
      password: ${SPRING_DATASOURCE_SLAVE_PASSWORD:password}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP-SERVERS:localhost:9092}
    consumer:
      group-id: risk-consumer
      auto-offset-reset: earliest
      concurrency: 3
      fetch-min-size: 1
      fetch-max-wait: 5000
      max-poll-records: 100
      max-poll-interval-ms: 300000
      session-timeout-ms: 30000
      heartbeat-interval-ms: 3000
    producer:
      acks: all
      batch-size: 32768
      linger-ms: 10
      retries: 5
      retry-backoff-ms: 100
      max-in-flight-requests-per-connection: 1
      compression-type: lz4

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}