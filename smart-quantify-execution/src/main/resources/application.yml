server:
  port: 8083

spring:
  application:
    name: smart-quantify-execution
  datasource:
    master:
      url: jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 3000
        idle-timeout: 300000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: master-hikari-pool
        validation-timeout: 5000
    slave:
      url: jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: slave-hikari-pool
        validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: execution-consumer
      auto-offset-reset: earliest
      concurrency: 5
      fetch-min-size: 1
      fetch-max-wait: 3000
      max-poll-records: 50
      max-poll-interval-ms: 300000
      session-timeout-ms: 30000
      heartbeat-interval-ms: 3000
    producer:
      acks: all
      batch-size: 32768
      linger-ms: 10
      retries: 5
      retry-backoff-ms: 100
      max-in-flight-requests-per-connection: 1
      compression-type: lz4

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}