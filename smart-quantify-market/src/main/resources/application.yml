server:
  port: 8084

spring:
  application:
    name: smart-quantify-market
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      batch-size: 32768
      linger-ms: 10
      retries: 5
      retry-backoff-ms: 100
      max-in-flight-requests-per-connection: 1
      compression-type: lz4

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}