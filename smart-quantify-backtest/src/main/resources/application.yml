server:
  port: 8085

spring:
  application:
    name: smart-quantify-backtest
  datasource:
    master:
      url: jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 3
        connection-timeout: 5000
        idle-timeout: 300000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: master-hikari-pool
        validation-timeout: 5000
    slave:
      url: jdbc:mysql://localhost:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 8000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: slave-hikari-pool
        validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}