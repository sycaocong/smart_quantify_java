server:
  port: 8080

spring:
  application:
    name: smart-quantify-gateway
  cloud:
    gateway:
      routes:
        - id: market-service
          uri: lb://smart-quantify-market
          predicates:
            - Path=/api/v1/market/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 200
                redis-rate-limiter.burstCapacity: 400
                key-resolver: "#{@remoteAddressKeyResolver}"
            - StripPrefix=2
        - id: strategy-service
          uri: lb://smart-quantify-strategy
          predicates:
            - Path=/api/v1/strategies/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@userIdKeyResolver}"
            - StripPrefix=2
        - id: risk-service
          uri: lb://smart-quantify-risk
          predicates:
            - Path=/api/v1/risk/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 150
                redis-rate-limiter.burstCapacity: 300
                key-resolver: "#{@remoteAddressKeyResolver}"
            - StripPrefix=2
        - id: execution-service
          uri: lb://smart-quantify-execution
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 300
                redis-rate-limiter.burstCapacity: 600
                key-resolver: "#{@apiKeyResolver}"
            - StripPrefix=2
        - id: backtest-service
          uri: lb://smart-quantify-backtest
          predicates:
            - Path=/api/v1/backtests/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userIdKeyResolver}"
            - StripPrefix=2

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
