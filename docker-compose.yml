version: '3.8'

networks:
  smart-quantify-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: smart-quantify-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_quantify
      MYSQL_USER: quantify
      MYSQL_PASSWORD: quantify123
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./smart-quantify-common/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-quantify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: smart-quantify-nacos
    ports:
      - "8848:8848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/service/list?pageNo=1&pageSize=10"]
      interval: 30s
      timeout: 20s
      retries: 10

  zookeeper:
    image: zookeeper:3.8
    container_name: smart-quantify-zookeeper
    ports:
      - "2181:2181"
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: smart-quantify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "market-data:1:1,signals:1:1,orders:1:1,order-created:1:1,order-executed:1:1"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    container_name: smart-quantify-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smart-quantify-gateway:
    build:
      context: .
      dockerfile: smart-quantify-gateway/Dockerfile
    container_name: smart-quantify-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  smart-quantify-strategy:
    build:
      context: .
      dockerfile: smart-quantify-strategy/Dockerfile
    container_name: smart-quantify-strategy
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_MASTER_USERNAME=quantify
      - SPRING_DATASOURCE_MASTER_PASSWORD=quantify123
      - SPRING_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_SLAVE_USERNAME=quantify
      - SPRING_DATASOURCE_SLAVE_PASSWORD=quantify123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  smart-quantify-risk:
    build:
      context: .
      dockerfile: smart-quantify-risk/Dockerfile
    container_name: smart-quantify-risk
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_MASTER_USERNAME=quantify
      - SPRING_DATASOURCE_MASTER_PASSWORD=quantify123
      - SPRING_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_SLAVE_USERNAME=quantify
      - SPRING_DATASOURCE_SLAVE_PASSWORD=quantify123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  smart-quantify-execution:
    build:
      context: .
      dockerfile: smart-quantify-execution/Dockerfile
    container_name: smart-quantify-execution
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_MASTER_USERNAME=quantify
      - SPRING_DATASOURCE_MASTER_PASSWORD=quantify123
      - SPRING_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_SLAVE_USERNAME=quantify
      - SPRING_DATASOURCE_SLAVE_PASSWORD=quantify123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  smart-quantify-market:
    build:
      context: .
      dockerfile: smart-quantify-market/Dockerfile
    container_name: smart-quantify-market
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  smart-quantify-backtest:
    build:
      context: .
      dockerfile: smart-quantify-backtest/Dockerfile
    container_name: smart-quantify-backtest
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_MASTER_USERNAME=quantify
      - SPRING_DATASOURCE_MASTER_PASSWORD=quantify123
      - SPRING_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql:3306/smart_quantify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_SLAVE_USERNAME=quantify
      - SPRING_DATASOURCE_SLAVE_PASSWORD=quantify123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CONFIG_IMPORT=optional:nacos:nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT-CHECK-ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-quantify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  clickhouse_data:
